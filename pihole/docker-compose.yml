services:
  pihole:
    container_name: pihole
    image: pihole/pihole:latest
    ports:
      - "53:53/tcp" # dns
      - "53:53/udp" # dns
      - "800:80/tcp" # interface web
      - "67:67/udp" # Uncomment the line below if you are using Pi-hole as your DHCP server
    environment:
      TZ: 'Europe/Paris'
      WEBPASSWORD: '${WEBPASSWORD}' # mot de passe de l'interface web
      FTLCONF_webserver_api_password: '${WEBPASSWORD}' # mot de passe de l'api
      FTLCONF_dns_listeningMode: 'ALL' # If using Docker's default `bridge` network setting the dns listening mode should be set to 'ALL'
    volumes:
      - '/data/pihole/etc-pihole:/etc/pihole/'
      - '/data/pihole/etc-dnsmasq.d:/etc/dnsmasq.d/' 
    restart: unless-stopped
    cap_add:
      # See https://docs.pi-hole.net/docker/#note-on-capabilities
      - NET_ADMIN # Required if you are using Pi-hole as your DHCP server, else not needed
      - SYS_TIME # Required if you are using Pi-hole as your NTP client to be able to set the host's system time
      - SYS_NICE # Optional, if Pi-hole should get some more processing time
    networks:
      - traefik-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.hole.rule=Host(`hole.thomega.fr`)"
      - "traefik.http.routers.hole.entrypoints=websecure"
      - "traefik.http.routers.hole.tls.certresolver=letsencrypt"
      - "traefik.http.services.hole.loadbalancer.server.port=80"
      - "traefik.http.routers.hole.middlewares=authentik-auth@docker"

networks:
  traefik-net:
    external: true
    name: traefik-net
