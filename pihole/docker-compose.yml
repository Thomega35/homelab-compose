services:
  pihole:
    container_name: pihole
    image: pihole/pihole:latest
    ports:
      - "800:80/tcp"
    environment:
      TZ: 'Europe/Paris'
      WEBPASSWORD: '${WEBPASSWORD}'
      FTLCONF_webserver_api_password: '${WEBPASSWORD}'
      FTLCONF_dns_listeningMode: 'ALL'
      FTLCONF_dhcp_active: 'true'
      FTLCONF_dhcp_start: '192.168.1.100'
      FTLCONF_dhcp_end: '192.168.1.250'
      FTLCONF_dhcp_router: '192.168.1.1'
      FTLCONF_dns_domain_name: 'thomega.fr'
      FTLCONF_dns_interface: 'eth0'
    volumes:
      - '/data/pihole/etc-pihole:/etc/pihole/'
      - '/data/pihole/etc-dnsmasq.d:/etc/dnsmasq.d/' 
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      - SYS_TIME
      - SYS_NICE
    networks:
      pihole-macvlan:
        ipv4_address: 192.168.1.6
      traefik-net:
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-net"
      - "traefik.http.routers.hole.rule=Host(`hole.thomega.fr`)"
      - "traefik.http.routers.hole.entrypoints=websecure"
      - "traefik.http.routers.hole.tls.certresolver=letsencrypt"
      - "traefik.http.services.hole-service.loadbalancer.server.port=80"
      - "traefik.http.routers.hole.middlewares=authentik-auth@docker"
      - "traefik.http.routers.hole.service=hole-service"
      - "traefik.http.routers.hole-bypass.rule=Host(`hole.thomega.fr`) && (PathPrefix(`/admin/img`) || PathPrefix(`/api`))"
      - "traefik.http.routers.hole-bypass.entrypoints=websecure"
      - "traefik.http.routers.hole-bypass.tls.certresolver=letsencrypt"
      - "traefik.http.routers.hole-bypass.service=hole-service"
networks:
  pihole-macvlan:
    driver: macvlan
    driver_opts:
      parent: enp34s0
    ipam:
      config:
        - subnet: 192.168.1.0/24
          gateway: 192.168.1.1
  traefik-net:
    external: true
    name: traefik-net
