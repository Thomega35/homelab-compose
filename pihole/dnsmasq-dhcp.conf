# Custom DHCP configuration for Docker bridge mode
# This tells dnsmasq to serve DHCP on all interfaces
# and maps the bridge interface eth0 to the LAN subnet

# Allow DHCP on all interfaces
bind-dynamic

# Set DHCP range on all interfaces
dhcp-range=192.168.1.100,192.168.1.250,255.255.255.0,24h

# Enable DHCP on all interfaces
dhcp-option=option:router,192.168.1.1
dhcp-option=option:domain-name,thomega.fr
