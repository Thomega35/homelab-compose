services:
  backend:
    image: zimengxiong/excalidash-backend:latest
    container_name: excalidash-backend
    environment:
      - DATABASE_PROVIDER=sqlite
      - DATABASE_URL=file:/app/prisma/dev.db
      - PORT=8000
      - NODE_ENV=production
      - FRONTEND_URL=https://excalidash.thomega.fr
      - AUTH_MODE=${AUTH_MODE:-oidc_enforced}
      - TRUST_PROXY=1
      - ENFORCE_HTTPS_REDIRECT=false
      - JWT_SECRET=${JWT_SECRET}
      - CSRF_SECRET=${CSRF_SECRET}
      - OIDC_PROVIDER_NAME=${OIDC_PROVIDER_NAME:-Authentik}
      - OIDC_ISSUER_URL=${OIDC_ISSUER_URL}
      - OIDC_CLIENT_ID=${OIDC_CLIENT_ID}
      - OIDC_CLIENT_SECRET=${OIDC_CLIENT_SECRET}
      - OIDC_REDIRECT_URI=${OIDC_REDIRECT_URI:-https://excalidash.thomega.fr/api/auth/oidc/callback}
      - OIDC_SCOPES=${OIDC_SCOPES:-openid profile email}
      - OIDC_GROUPS_CLAIM=${OIDC_GROUPS_CLAIM:-groups}
      - OIDC_ADMIN_GROUPS=${OIDC_ADMIN_GROUPS:-excalidash-admins}
      - OIDC_REQUIRE_EMAIL_VERIFIED=${OIDC_REQUIRE_EMAIL_VERIFIED:-false}
    volumes:
      - /data/excalidash/backend-data:/app/prisma
    networks:
      - excalidash-network
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:8000/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    image: zimengxiong/excalidash-frontend:latest
    container_name: excalidash-frontend
    environment:
      - BACKEND_URL=backend:8000
    depends_on:
      - backend
    networks:
      - excalidash-network
      - traefik-net
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://127.0.0.1:80",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.excalidash.rule=Host(`excalidash.thomega.fr`)'
      - 'traefik.http.routers.excalidash.entryPoints=websecure'
      - 'traefik.http.services.excalidash.loadbalancer.server.port=80'
      - 'traefik.docker.network=traefik-net'

networks:
  excalidash-network:
    driver: bridge
  traefik-net:
    external: true
    name: traefik-net