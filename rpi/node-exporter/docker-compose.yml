services:
  # Host metrics (incl. the WD My Cloud share), scraped by Prometheus on thome-server over Tailscale
  node-exporter:
    image: prom/node-exporter:v1.12.1
    container_name: node-exporter
    network_mode: host
    pid: host
    volumes:
      - /:/host:ro,rslave # rslave: see the NAS share when it is (re)mounted
    command:
      - '--path.rootfs=/host'
      - '--web.listen-address=${TAILSCALE_IP}:9100'
      - '--collector.filesystem.mount-points-exclude=^/(dev|proc|run|sys|var/lib/docker/.+)($$|/)'
    restart: unless-stopped
