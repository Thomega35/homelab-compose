services:
  lan-orangutan:
    image: ghcr.io/291-group/lan-orangutan:latest
    container_name: lan-orangutan
    restart: unless-stopped
    # Host networking is required to scan the real LAN instead of Docker's bridge
    network_mode: host
    cap_add:
      - NET_RAW
      - NET_ADMIN
      - NET_BIND_SERVICE
    environment:
      - ORANGUTAN_PORT=291
      # Auth is handled by Authentik; bind to docker0 only so the LAN can't bypass Traefik
      - ORANGUTAN_ALLOW_INSECURE=true
      - ORANGUTAN_BIND_ADDRESS=172.17.0.1
      - TZ=Europe/Paris
    volumes:
      - /data/lan-orangutan:/var/lib/lan-orangutan
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://172.17.0.1:291/static/orangutan.svg"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.lan-orangutan.rule=Host(`lano.thomega.fr`)'
      - 'traefik.http.routers.lan-orangutan.entryPoints=websecure'
      - 'traefik.http.services.lan-orangutan.loadbalancer.server.port=291'
      - 'traefik.docker.network=traefik-net'
      - 'traefik.http.routers.lan-orangutan.middlewares=authentik-auth@docker'
