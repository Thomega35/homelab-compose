services:
  app:
    image: alswl/excalidraw:v0.18.0-fork-b1
    restart: unless-stopped
    healthcheck:
      disable: true
    environment:
      - VITE_APP_BACKEND_V2_GET_URL=https://${STORAGE_BACKEND_HOST}/api/v2/scenes/
      - VITE_APP_BACKEND_V2_POST_URL=https://${STORAGE_BACKEND_HOST}/api/v2/scenes/
      - VITE_APP_WS_SERVER_URL=https://${ROOM_HOST}/
      - VITE_APP_FIREBASE_CONFIG={}
      - VITE_APP_HTTP_STORAGE_BACKEND_URL=https://${STORAGE_BACKEND_HOST}/api/v2
      - VITE_APP_STORAGE_BACKEND=http
      - VITE_APP_DISABLE_TRACKING=true
      - PUBLIC_URL=https://${APP_HOST}
    networks:
      - traefik-net
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${TRAEFIK_NETWORK_NAME}"
      - "traefik.http.routers.drawapp.rule=Host(`${APP_HOST}`)"
      - "traefik.http.routers.drawapp.entryPoints=${TRAEFIK_ENTRYPOINT}"
      - "traefik.http.routers.drawapp.tls=true"
      - "traefik.http.routers.drawapp.service=drawapp"
      - "traefik.http.services.drawapp.loadbalancer.server.port=80"

  storage:
    image: alswl/excalidraw-storage-backend:v2023.11.11
    restart: unless-stopped
    environment:
      - STORAGE_URI=mongodb://${DB_USER}:${DB_PASS}@mongodb:27017
    networks:
      - traefik-net
      - draw-internal
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${TRAEFIK_NETWORK_NAME}"
      - "traefik.http.routers.draw-storage.rule=Host(`${STORAGE_BACKEND_HOST}`)"
      - "traefik.http.routers.draw-storage.entryPoints=${TRAEFIK_ENTRYPOINT}"
      - "traefik.http.routers.draw-storage.tls=true"
      - "traefik.http.services.draw-storage.loadbalancer.server.port=8080"

  room:
    image: excalidraw/excalidraw-room:sha-49bf529
    restart: unless-stopped
    networks:
      - traefik-net
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${TRAEFIK_NETWORK_NAME}"
      - "traefik.http.routers.draw-room.rule=Host(`${ROOM_HOST}`)"
      - "traefik.http.routers.draw-room.entryPoints=${TRAEFIK_ENTRYPOINT}"
      - "traefik.http.routers.draw-room.tls=true"
      - "traefik.http.services.draw-room.loadbalancer.server.port=80"

  mongodb:
    image: mongo:7.0.5-jammy
    restart: unless-stopped
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${DB_USER}
      - MONGO_INITDB_ROOT_PASSWORD=${DB_PASS}
    volumes:
      - ${DB_VOLUME_PATH}:/data/db
    networks:
      - draw-internal
    labels:
      - "traefik.enable=false"

  mongoexpress:
    image: mongo-express:latest
    environment:
      - ME_CONFIG_MONGODB_URL=mongodb://${DB_USER}:${DB_PASS}@mongodb:27017
      - ME_CONFIG_BASICAUTH=true
      - ME_CONFIG_BASICAUTH_USERNAME=${MONGOEXPRESS_USER}
      - ME_CONFIG_BASICAUTH_PASSWORD=${MONGOEXPRESS_PASS}
    depends_on:
      - mongodb
    restart: unless-stopped
    networks:
      - traefik-net
      - draw-internal
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${TRAEFIK_NETWORK_NAME}"
      - "traefik.http.routers.draw-db.rule=Host(`${MONGOEXPRESS_HOST}`)"
      - "traefik.http.routers.draw-db.entryPoints=${TRAEFIK_ENTRYPOINT}"
      - "traefik.http.routers.draw-db.tls=true"
      - "traefik.http.services.draw-db.loadbalancer.server.port=8081"

networks:
  traefik-net:
    name: ${TRAEFIK_NETWORK_NAME}
    external: true
  draw-internal:
    name: draw-internal
    external: false
