global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Prometheus s'auto-surveille
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Métriques du système hôte via Node Exporter
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: 'windows-pc' 
    static_configs:
      - targets: ['windows-pc-exporter:9182']

  - job_name: 'grafana'
    static_configs:
      - targets: ['grafana:3000']
    metrics_path: /metrics

  # Authentik core and worker metrics on the built-in Prometheus port
  - job_name: 'authentik-server'
    static_configs:
      - targets: ['authentik_server:9300']

  - job_name: 'authentik-worker'
    static_configs:
      - targets: ['authentik_worker:9300']

  # Traefik built-in Prometheus metrics endpoint
  - job_name: 'traefik'
    static_configs:
      - targets: ['traefik:8082']

  # DaWarich exporter (enabled in the app and sidekiq containers)
  - job_name: 'dawarich'
    static_configs:
      - targets: ['dawarich_app:9394']

