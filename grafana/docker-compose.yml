networks:
  monitoring:
    driver: bridge
  traefik-net:
    external: true

services:
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_CONFIG_OVERRIDE_MODE=env
      - GF_SERVER_ROOT_URL=https://grafana.thomega.fr
      - GF_METRICS_ENABLED=true
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
      - GF_AUTH_GENERIC_OAUTH_ENABLED=true
      - GF_AUTH_GENERIC_OAUTH_NAME=Authentik
      - GF_AUTH_GENERIC_OAUTH_CLIENT_ID=${GF_AUTH_GENERIC_OAUTH_CLIENT_ID}
      - GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET=${GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET}
      - GF_AUTH_GENERIC_OAUTH_SCOPES=openid email profile entitlements
      - GF_AUTH_GENERIC_OAUTH_AUTH_URL=https://auth.thomega.fr/application/o/authorize/
      - GF_AUTH_GENERIC_OAUTH_TOKEN_URL=https://auth.thomega.fr/application/o/token/
      - GF_AUTH_GENERIC_OAUTH_API_URL=https://auth.thomega.fr/application/o/userinfo/
      - GF_AUTH_SIGNOUT_REDIRECT_URL=https://auth.thomega.fr/application/o/grafana/end-session/
      - GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_SYNC_ON_SIGN_IN=true
      - GF_AUTH_GENERIC_OAUTH_ALLOW_ASSIGN_GRAFANA_ADMIN=true
      - GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH=contains(entitlements[*], 'Grafana Admins') && 'GrafanaAdmin' || contains(entitlements[*], 'Grafana Editors') && 'Editor' || 'Viewer'
      - GF_AUTH_GENERIC_OAUTH_GROUPS_ATTRIBUTE_PATH=groups
    extra_hosts:
      - "stats.grafana.org:127.0.0.1"
    volumes:
      - grafana-data:/var/lib/grafana
    labels:
      - 'traefik.enable=true'
      - 'traefik.docker.network=traefik-net'
      - 'traefik.http.routers.grafana.rule=Host(`grafana.thomega.fr`)'
      - 'traefik.http.routers.grafana.entrypoints=websecure'
      - 'traefik.http.services.grafana.loadbalancer.server.port=3000'
    networks:
      - monitoring
      - traefik-net
    restart: unless-stopped

  # Prometheus - Metriques
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    environment:
      - WINDOWS_PC_IP=${WINDOWS_PC_IP}
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-remote-write-receiver'
    labels:
      - 'traefik.enable=true'
      - 'traefik.docker.network=traefik-net'
      - 'traefik.http.routers.prometheus.rule=Host(`prometheus.thomega.fr`)'
      - 'traefik.http.routers.prometheus.entrypoints=websecure'
      - 'traefik.http.routers.prometheus.middlewares=authentik-auth@docker'
      - 'traefik.http.services.prometheus.loadbalancer.server.port=9090'
    networks:
      - monitoring
      - traefik-net
    restart: unless-stopped

  # Node Exporter - Métriques de l'hôte (CPU, RAM, etc.)
  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    restart: unless-stopped
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    networks:
      - monitoring

  # Loki - Agrégation de logs
  loki:
    image: grafana/loki:latest
    container_name: loki
    ports:
      - "3100:3100"
    volumes:
      - ./loki-config.yml:/etc/loki/local-config.yaml
      - loki-data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - monitoring
    restart: unless-stopped

  # Grafana Alloy - Collecteur moderne
  alloy:
    image: grafana/alloy:latest
    container_name: alloy
    ports:
      - "12345:12345"
    extra_hosts:
      - "stats.grafana.org:127.0.0.1"
    volumes:
      - ./config.alloy:/etc/alloy/config.alloy:ro
      - /var/log:/var/log:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: run --disable-reporting --storage.path=/var/lib/alloy/data /etc/alloy/config.alloy
    networks:
      - monitoring
    restart: unless-stopped

volumes:
  grafana-data:
  prometheus-data:
  loki-data:
