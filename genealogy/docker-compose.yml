services:
  grampsweb: &grampsweb
    image: ghcr.io/gramps-project/grampsweb:latest
    restart: unless-stopped
    environment:
      GRAMPSWEB_TREE: "Arbre Thomas Delapart"
      GRAMPSWEB_CELERY_CONFIG__broker_url: "redis://grampsweb_redis:6379/0"
      GRAMPSWEB_CELERY_CONFIG__result_backend: "redis://grampsweb_redis:6379/0"
      GRAMPSWEB_RATELIMIT_STORAGE_URI: redis://grampsweb_redis:6379/1
    depends_on:
      - grampsweb_redis
    volumes:
      - gramps_users:/app/users
      - gramps_index:/app/indexdir
      - gramps_thumb_cache:/app/thumbnail_cache
      - gramps_cache:/app/cache
      - gramps_secret:/app/secret
      - gramps_db:/root/.gramps/grampsdb
      - gramps_media:/app/media
      - gramps_tmp:/tmp
    networks:
      - traefik-net
      - gramps-internal
    labels:
      - 'traefik.enable=true'
      - 'traefik.docker.network=traefik-net'
      - 'traefik.http.routers.grampsweb.rule=Host(`gen.thomega.fr`)'
      - 'traefik.http.routers.grampsweb.entryPoints=websecure'
      - 'traefik.http.routers.grampsweb.tls=true'
      - 'traefik.http.services.grampsweb.loadbalancer.server.port=5000'

  grampsweb_celery:
    <<: *grampsweb
    labels: []
    networks:
      - gramps-internal
    depends_on:
      - grampsweb_redis
    command: celery -A gramps_webapi.celery worker --loglevel=INFO

  grampsweb_redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    networks:
      - gramps-internal

volumes:
  gramps_users:
  gramps_index:
  gramps_thumb_cache:
  gramps_cache:
  gramps_secret:
  gramps_db:
  gramps_media:
  gramps_tmp:

networks:
  traefik-net:
    external: true
  gramps-internal:
