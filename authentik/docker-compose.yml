services:
  postgres:
    image: docker.io/library/postgres:16-alpine
    restart: unless-stopped
    container_name: authentik_postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
      start_period: 20s
      interval: 30s
      retries: 5
      timeout: 5s
    volumes:
      - /data/authentik/postgres:/var/lib/postgresql/data
    environment:
      POSTGRES_PASSWORD: ${AUTHENTIK_DB_PASSWORD}
      POSTGRES_USER: ${PG_USER:-authentik}
      POSTGRES_DB: ${PG_DB:-authentik}
    networks:
      - traefik-net  # <-- Added so the network exists here

  redis:
    image: docker.io/library/redis:alpine
    restart: unless-stopped
    container_name: authentik_redis
    hostname: redis
    command: --save 60 1 --loglevel warning
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      start_period: 20s
      interval: 30s
      retries: 5
      timeout: 3s
    volumes:
      - /data/authentik/redis:/data
    networks:
      - traefik-net  # <-- Added so redis is on the same wire

  server:
    image: ghcr.io/goauthentik/server:2026.2
    restart: unless-stopped
    command: server
    container_name: authentik_server
    hostname: authentik_server
    ports:
      - "9000:9000" 
      - "8000:8000" 
    environment:
      # Changed to match the exact service block keys below to prevent DNS failure
      AUTHENTIK_REDIS__HOST: redis                
      AUTHENTIK_POSTGRESQL__HOST: postgres        
      AUTHENTIK_POSTGRESQL__USER: ${PG_USER:-authentik}
      AUTHENTIK_POSTGRESQL__NAME: ${PG_DB:-authentik}
      AUTHENTIK_POSTGRESQL__PASSWORD: ${AUTHENTIK_DB_PASSWORD}
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY}
      TZ: Europe/Paris
    volumes:
      - /data/authentik/media:/media
      - /data/authentik/custom-templates:/templates
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.authentik.rule=Host(`auth.thomega.fr`)'
      - 'traefik.http.routers.authentik.entryPoints=websecure'
      - 'traefik.http.services.authentik.loadbalancer.server.port=9000'
      - 'traefik.http.middlewares.authentik.forwardauth.address=http://authentik_server:9000/outpost.goauthentik.io/auth/traefik'
      - 'traefik.http.middlewares.authentik.forwardauth.trustForwardHeader=true'
      - 'traefik.http.middlewares.authentik.forwardauth.authResponseHeaders=X-authentik-username,X-authentik-groups,X-authentik-email,X-authentik-name,X-authentik-uid,X-authentik-jwt,X-authentik-meta-jwks,X-authentik-meta-outpost,X-authentik-meta-provider,X-authentik-meta-app,X-authentik-meta-version'
    networks:
      - traefik-net

  worker:
    image: ghcr.io/goauthentik/server:2026.2
    restart: unless-stopped
    container_name: authentik_worker
    command: worker
    environment:
      # Kept as redis/postgres because they share the traefik internal aliases
      AUTHENTIK_REDIS__HOST: redis
      AUTHENTIK_POSTGRESQL__HOST: postgres
      AUTHENTIK_POSTGRESQL__USER: ${PG_USER:-authentik}
      AUTHENTIK_POSTGRESQL__NAME: ${PG_DB:-authentik}
      AUTHENTIK_POSTGRESQL__PASSWORD: ${AUTHENTIK_DB_PASSWORD}
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY}
    user: root
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /data/authentik/media:/media
      - /data/authentik/certs:/certs
      - /data/authentik/custom-templates:/templates
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - traefik-net  # <-- Added worker to the grid

  authentik_ldap:
    image: ghcr.io/goauthentik/ldap:2026.2
    restart: always
    container_name: authentik_ldap
    environment:
      AUTHENTIK_HOST: https://auth.thomega.fr
      AUTHENTIK_INSECURE: "false"
      AUTHENTIK_TOKEN: ${AUTHENTIK_LDAP_TOKEN}
    networks:
      - traefik-net  # <-- Added LDAP proxy helper to the grid

networks:
  traefik-net:
    external: true