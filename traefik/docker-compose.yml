services:
  traefik:
    image: traefik:v3.6
    command:
      - "--providers.docker=true"
      - "--certificatesresolvers.letsencrypt.acme.email=admin@thomega.fr"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
      - "--certificatesresolvers.letsencrypt.acme.dnschallenge.provider=cloudflare"
      - "--certificatesresolvers.letsencrypt.acme.dnschallenge.resolvers=1.1.1.1:53,8.8.8.8:53"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.websecure.http.tls=true"
      - "--entrypoints.websecure.http.tls.certResolver=letsencrypt"
      - "--entrypoints.websecure.http.tls.domains[0].main=thomega.fr"
      - "--entrypoints.websecure.http.tls.domains[0].sans=*.thomega.fr"
      - "--entrypoints.websecure.http.tls.domains[1].main=fanfare-makabes.fr"
      - "--entrypoints.websecure.http.tls.domains[1].sans=*.fanfare-makabes.fr"
      - "--entrypoints.websecure.http.encodedCharacters.allowEncodedHash=true"
      - "--entrypoints.websecure.http.encodedCharacters.allowEncodedSlash=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.file.filename=/letsencrypt/config.yaml"
      - "--api.dashboard=true"
      - "--api.insecure=true"
      - "--serversTransport.insecureSkipVerify=true"
      - "--metrics.prometheus=true"
      - "--entryPoints.metrics.address=:8082"
      - "--metrics.prometheus.entryPoint=metrics"
      # Ajoute ces lignes dans les commandes de ton container Traefik :
      # https://docs.immich.app/administration/reverse-proxy/
      - "--entrypoints.websecure.transport.respondingTimeouts.readTimeout=3600s"
      - "--entrypoints.websecure.transport.respondingTimeouts.writeTimeout=3600s"
      - "--entrypoints.websecure.transport.respondingTimeouts.idleTimeout=3600s"
    environment:
      CLOUDFLARE_EMAIL: ${CLOUDFLARE_EMAIL}
      CF_DNS_API_TOKEN: ${CF_DNS_API_TOKEN}
    ports:
      - 80:80
      - 443:443
      - 50:22
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /data/traefik:/letsencrypt
    restart: unless-stopped
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.api.rule=Host(`traefik.thomega.fr`)'
      - 'traefik.http.routers.api.entryPoints=websecure'
      - 'traefik.http.routers.api.service=api@internal'
      - 'traefik.http.services.api.loadbalancer.server.port=8080'
      - 'traefik.http.routers.api.middlewares=authentik-auth@docker'
    networks:
      - traefik-net
      - default

  cloudflare-ddns-thomega:
    image: favonia/cloudflare-ddns:1
    environment:
      CLOUDFLARE_API_TOKEN: ${CF_DNS_API_TOKEN}
      DOMAINS: ${CF_DDNS_THOMEGA_DOMAIN}
      PROXIED: ${CF_DDNS_THOMEGA_PROXIED:-false}
      IP6_PROVIDER: ${CF_DDNS_IP6_PROVIDER:-none}
      TZ: ${TZ:-UTC}
    restart: unless-stopped

  cloudflare-ddns-fanfare:
    image: favonia/cloudflare-ddns:1
    environment:
      CLOUDFLARE_API_TOKEN: ${CF_DNS_API_TOKEN}
      DOMAINS: ${CF_DDNS_FANFARE_DOMAIN}
      PROXIED: ${CF_DDNS_FANFARE_PROXIED:-true}
      IP6_PROVIDER: ${CF_DDNS_IP6_PROVIDER:-none}
      TZ: ${TZ:-UTC}
    restart: unless-stopped

networks:
  traefik-net:
    driver: bridge
    name: traefik-net
