services:
  mc:
    image: itzg/minecraft-server
    tty: true
    stdin_open: true
    restart: unless-stopped
    container_name: minecraft
    ports:
      - "25565:25565"
      - "8124:8100"
      - "24454:24454/udp"
    environment:
      EULA: "TRUE"
      VERSION: "26.2"
      TYPE: "FABRIC"
      MAX_MEMORY: "4G"
      ENABLE_AUTOPAUSE: "false"
      JVM_DD_OPTS: "disable.watchdog:true"
      MAX_TICK_TIME: "-1"
      VIEW_DISTANCE: "16"
      SIMULATION_DISTANCE: "10"
      SPAWN_PROTECTION: "0"
      ENABLE_WHITELIST: false
      OPS: "${OPS}"
      # Fabric API - required dependency for the mods below
      # BlueMap v5.22 - map visualization
      # Voice Chat v2.6.22 - proximity voice
      # Voice Chat Discord Bridge v3.2.1 - links voice chat proximity audio with Discord
      # Invisible Frames v2.0.1 - allows frame items to be invisible while preserving function
      # Discord MC Chat v2.7.1 - DiscordSRV replacement: text chat bridge to Discord (DiscordSRV has no Fabric build)
      # Enderite Mod dropped: requires matching client-side install, blocking unmodded players from joining
      MODS: |
        https://cdn.modrinth.com/data/P7dR8mSH/versions/UWwhUX3k/fabric-api-0.160.0%2B26.2.jar
        https://github.com/BlueMap-Minecraft/BlueMap/releases/download/v5.22/bluemap-5.22-fabric.jar
        https://cdn.modrinth.com/data/9eGKb6K1/versions/DKSq5wO6/voicechat-fabric-2.6.22%2B26.2.jar
        https://cdn.modrinth.com/data/S1jG5YV5/versions/V3XoOhMl/voicechat-discord-fabric-26.1-3.2.1.jar
        https://cdn.modrinth.com/data/QD87oMUf/versions/ELIgkzTp/invisibleframes-fabric-2.0.1%2B26.2.jar
        https://cdn.modrinth.com/data/D0sHdnXY/versions/8HnBxTfE/Discord-MC-Chat-2.7.1-compat.2.jar
    volumes:
      - /data/minecraft:/data
    networks:
      - traefik-net
    labels:
      - 'traefik.enable=true'
      - 'traefik.docker.network=traefik-net'

      # BlueMap Web UI Router
      - 'traefik.http.routers.bluemap.rule=Host(`minecraft.thomega.fr`)'
      - 'traefik.http.routers.bluemap.entryPoints=websecure'
      - 'traefik.http.routers.bluemap.service=bluemap-svc'
      - 'traefik.http.routers.bluemap.priority=1'
      - 'traefik.http.services.bluemap-svc.loadbalancer.server.port=8100'

networks:
  traefik-net:
    external: true