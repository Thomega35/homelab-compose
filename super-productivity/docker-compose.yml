services:
  app:
    image: johannesjo/super-productivity:v19.3.1
    container_name: super-productivity
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      - SYNC_INTERVAL=${SYNC_INTERVAL:-15}
      - IS_COMPRESSION_ENABLED=${IS_COMPRESSION_ENABLED:-true}
      - IS_ENCRYPTION_ENABLED=${IS_ENCRYPTION_ENABLED:-false}
    networks:
      - traefik-net
    labels:
      - 'traefik.enable=true'
      - 'traefik.docker.network=${TRAEFIK_NETWORK_NAME:-traefik-net}'
      - 'traefik.http.routers.super-productivity.rule=Host(`${SUPER_PRODUCTIVITY_HOST:-sp.thomega.fr}`)'
      - 'traefik.http.routers.super-productivity.entryPoints=${TRAEFIK_ENTRYPOINT:-websecure}'
      - 'traefik.http.routers.super-productivity.tls=true'
      - 'traefik.http.services.super-productivity.loadbalancer.server.port=80'
      - 'traefik.http.routers.super-productivity.middlewares=authentik-auth@docker'

networks:
  traefik-net:
    name: ${TRAEFIK_NETWORK_NAME:-traefik-net}
    external: true
